version: 2
# Two settings matter for reviewing this file:
#  - the Microsandbox SDK is ignored (see the note in the root gomod entry),
#    because its version must move together with the hosted runtime version and
#    digests held in the code;
#  - updates are grouped, so Dependabot opens one PR per group and per cycle
#    instead of one PR per dependency.
updates:
  # Go: root module.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The Microsandbox SDK is pinned to the hosted runtime: msbRuntimeVersion and
    # the five archive digests in internal/justcode/msb_runtime_install.go have to
    # move with go.mod, and TestMSBRuntimeVersionMatchesSDK fails CI whenever SDK
    # version and runtime version drift apart, so an isolated Dependabot bump is
    # always red. Upstream releases are detected and turned into a tracked issue by
    # .github/workflows/msb-runtime-watch.yml, which carries the procedure for the
    # coordinated reviewed bump (see issue #158).
    # The name is written exactly as declared in go.mod so the match is guaranteed;
    # add the new name here too if the module path ever changes (for example to
    # .../microsandbox/sdk/go/v2).
    #
    # Consequence to know about: an ignore by dependency-name also suppresses
    # Dependabot *security update* pull requests for this dependency, not only
    # version updates. Dependabot alerts and .github/workflows/osv-scanner.yml
    # still report a vulnerable SDK version; the response is the coordinated manual
    # bump, never an automatic PR.
    ignore:
      - dependency-name: "github.com/superradcompany/microsandbox/sdk/go"
    groups:
      go-root:
        # One PR per week for all Go updates in the root module.
        patterns: ["*"]

  # Go: integration-test fixtures. Each of these manifests declares only the
  # Microsandbox SDK, so with the same ignore repeated here (ignore is scoped to
  # one entry, not to the file) they are expected to stay quiet. The entries are
  # kept so that any dependency added later is still covered.
  - package-ecosystem: "gomod"
    directories:
      - "/tests/integration/project-secrets/native"
      - "/tests/integration/project-secrets/native-phase3"
      - "/tests/integration/project-secrets/native-phase4"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "github.com/superradcompany/microsandbox/sdk/go"
    groups:
      go-fixtures:
        # One PR per dependency across all three fixture modules, instead of
        # three identical PRs.
        group-by: "dependency-name"
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/tests/integration/project-secrets"
      - "/tests/integration/project-secrets/native-phase3/guest/node-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # dotenv-expand 1000.0.0 is refused by the loader-contract suite: it
    # imports child_process and evaluates `$(...)` command substitution inside
    # .env values in every quote mode, so the tests named "dotenv-expand does
    # not evaluate command substitution" fail and turn the fixture-contracts
    # CI job red (see the Observed Matrix in
    # tests/integration/project-secrets/README.md). Ignore the major here so
    # Dependabot stops proposing it weekly; an `@dependabot ignore` comment is
    # a no-op on a PR built from a group rule (see #271). Versions below 1000
    # stay eligible: 13.0.0 keeps `$(...)` verbatim and passes the guards.
    # As for the msb SDK entry above, this also suppresses security-update
    # PRs whose only fix is a version >= 1000; the response then is the
    # coordinated manual bump, never an automatic PR.
    ignore:
      - dependency-name: "dotenv-expand"
        versions: [">=1000.0.0"]
    groups:
      npm-fixtures:
        group-by: "dependency-name"
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/tests/integration/project-secrets"
      - "/tests/integration/project-secrets/native-phase3/guest/python-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-fixtures:
        group-by: "dependency-name"
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pre-commit-all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
