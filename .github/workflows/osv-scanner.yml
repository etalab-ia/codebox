# OSV-Scanner: dependency vulnerability scanning against the OSV database.
# - Scheduled scan: weekly + on push to main, uploads SARIF to Code Scanning.
#   Reports all known vulnerabilities; does not block.
# - PR scan: fails only on vulnerabilities newly introduced by the PR.
# See https://github.com/etalab-ia/codebox/issues/111

name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "12 12 * * 1"

permissions: {}

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Report-only: pre-existing vulnerabilities surface in Code Scanning
      # without failing CI. The PR scan is the blocking gate.
      fail-on-vuln: false

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Ratchet: fail only on vulnerabilities introduced by this PR.
      fail-on-vuln: true
      # Fork PRs get a read-only GITHUB_TOKEN; SARIF upload would 403 and
      # fail the job regardless of vulnerabilities. PR results surface in
      # the job log and annotations instead.
      upload-sarif: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
