# Detects a newer upstream Microsandbox runtime, verifies its release
# attestation, opens a tracking issue, and prepares one coordinated draft PR.
# This workflow never provisions infrastructure or runs hardware qualification.
#
# Trust boundary: source digests only from the verified attestation subjects,
# not the upstream checksums file, which could be swapped with the archives.
# The updater also downloads every archive, compares its bytes with that
# attested digest, and checks the expected runtime members before editing.
#
# GITHUB_TOKEN-created commits are verified by GitHub through
# create-pull-request's sign-commits mode. Drafts avoid automatic PR CI on every
# scheduled run; marking one ready for review triggers the required checks.

name: msb-runtime-watch

on:
  schedule:
    # Mondays 09:00 UTC, same cadence as the dependency sweep.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: msb-runtime-watch
  cancel-in-progress: false

env:
  UPSTREAM_REPO: superradcompany/microsandbox
  # Must stay in sync with msbRuntimeArtifactFor and msb_runtime_update.py.
  EXPECTED_ASSETS: >-
    microsandbox-darwin-aarch64.tar.gz
    microsandbox-linux-aarch64.tar.gz
    microsandbox-linux-x86_64.tar.gz
    microsandbox-windows-aarch64.tar.gz
    microsandbox-windows-x86_64.tar.gz

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codebox/go.mod
          cache: true
          cache-dependency-path: apps/codebox/go.sum

      - name: Resolve SDK and upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk_version="$(go -C apps/codebox run ./cmd/codebox -print-msb-sdk-version)"
          upstream="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          upstream_version="${upstream#v}"
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "SDK=$sdk_version upstream=$upstream_version"

      - name: Open or update the tracking issue
        if: steps.versions.outputs.upstream_version != steps.versions.outputs.sdk_version
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDK_VERSION: ${{ steps.versions.outputs.sdk_version }}
          UPSTREAM_VERSION: ${{ steps.versions.outputs.upstream_version }}
          MSB_ATTESTATION_PATH: ${{ runner.temp }}/msb-attestation.json
          MSB_ISSUE_BODY_PATH: ${{ runner.temp }}/msb-runtime-issue.md
        run: bash .github/scripts/msb_runtime_watch_issue.sh

      - name: Find an existing update PR
        if: steps.versions.outputs.upstream_version != steps.versions.outputs.sdk_version
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_VERSION: ${{ steps.versions.outputs.upstream_version }}
        run: |
          set -euo pipefail
          branch="automation/msb-runtime-v${UPSTREAM_VERSION}"
          pr_number="$(gh pr list --state open --head "$branch" --json number --jq 'if length == 0 then "" elif length == 1 then .[0].number else error("duplicate open runtime update PRs") end')"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          if [ -n "$pr_number" ]; then
            echo "An update PR for v$UPSTREAM_VERSION is already open (#$pr_number)."
          fi

      - name: Prepare the coordinated update
        if: steps.versions.outputs.upstream_version != steps.versions.outputs.sdk_version && steps.existing-pr.outputs.pr_number == ''
        run: |
          python3 .github/scripts/msb_runtime_update.py \
            --attestation "${{ runner.temp }}/msb-attestation.json" \
            --body-path "${{ runner.temp }}/msb-runtime-update-pr.md" \
            --version "${{ steps.versions.outputs.upstream_version }}" \
            --sdk-version "${{ steps.versions.outputs.sdk_version }}" \
            --issue-number "${{ steps.issue.outputs.issue_number }}"

      - name: Test the coordinated update on hosted CI
        if: steps.versions.outputs.upstream_version != steps.versions.outputs.sdk_version && steps.existing-pr.outputs.pr_number == ''
        run: |
          set -euo pipefail
          go -C apps/codebox test ./...
          GOWORK=off go -C apps/codebox/tests/integration/project-secrets/native test ./...

      - name: Create the signed draft PR
        if: steps.versions.outputs.upstream_version != steps.versions.outputs.sdk_version && steps.existing-pr.outputs.pr_number == ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          sign-commits: true
          branch: automation/msb-runtime-v${{ steps.versions.outputs.upstream_version }}
          base: main
          title: "chore(msb): update Microsandbox runtime to v${{ steps.versions.outputs.upstream_version }}"
          commit-message: "chore(msb): update Microsandbox runtime to v${{ steps.versions.outputs.upstream_version }}"
          body-path: ${{ runner.temp }}/msb-runtime-update-pr.md
          labels: enhancement
          draft: always-true
          delete-branch: true
