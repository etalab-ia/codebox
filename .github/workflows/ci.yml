name: CI

on:
  pull_request:
    # GITHUB_TOKEN-created update PRs stay draft until review; ready_for_review
    # is their first CI trigger because bot pushes cannot start new workflows.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_platforms: ${{ steps.classify.outputs.run_platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify platform CI scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" | bash .github/scripts/platform-ci-scope.sh "$EVENT_NAME" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/platform-ci-scope.sh "$EVENT_NAME" </dev/null >> "$GITHUB_OUTPUT"
          fi
      - name: Test platform CI classifier
        run: bash .github/scripts/test-platform-ci-scope.sh
      - name: Test msb runtime watch issue script
        run: bash .github/scripts/test-msb-runtime-watch-issue.sh
      - name: Test msb runtime update preparer
        run: python3 .github/scripts/test_msb_runtime_update.py
      - name: Test manual msb hardware watchdog
        run: bash .github/scripts/test-msb-hardware-watchdog.sh

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codebox/go.mod
          cache: true
          cache-dependency-path: apps/codebox/go.sum
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.63.2"
          moon-version: "2.6.5"
          auto-install: false
      - name: Validate Moon workspace and toolchain pins
        run: |
          set -eu
          proto_go="$(sed -n 's/^go = "\(.*\)"$/\1/p' .prototools)"
          work_toolchain="$(sed -n 's/^toolchain go\(.*\)$/\1/p' go.work)"
          if [ -z "$work_toolchain" ]; then
            work_toolchain="$(sed -n 's/^go \(.*\)$/\1/p' go.work)"
          fi
          for mod in apps/codebox/go.mod apps/codebox-server/go.mod packages/secrets/go.mod; do
            mod_toolchain="$(sed -n 's/^toolchain go\(.*\)$/\1/p' "$mod")"
            if [ -z "$mod_toolchain" ]; then
              mod_toolchain="$(sed -n 's/^go \(.*\)$/\1/p' "$mod")"
            fi
            test "$proto_go" = "$mod_toolchain"
          done
          test -n "$proto_go" && test "$proto_go" = "$work_toolchain"
          proto status
          moon sync config-schemas
          test "$(moon query projects | jq -r '.projects | map(.id) | sort | join(",")')" = "codebox,codebox-server,codebox-server-e2e,secrets"
          moon query tasks >/dev/null
      - name: Check formatting and vet via Moon
        run: |
          set -eu
          moon run :fmt-check :vet
          git diff --exit-code .protolock go.work apps/codebox/go.mod apps/codebox/go.sum apps/codebox-server/go.mod packages/secrets/go.mod
      - run: GOWORK=off go -C packages/secrets test -race ./...
      - run: GOWORK=off go -C apps/codebox-server test -race ./...
      - run: go -C apps/codebox test -race ./...
      - name: Test POSIX installer
        run: sh apps/codebox/tests/installers/test-posix.sh
      - name: Run codebox-server e2e smoke
        run: moon run codebox-server-e2e:smoke
      - name: Test UI-only codebox-server deployment reconciliation
        run: python3 .github/scripts/test_deploy_codebox_server.py

  integration-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codebox/go.mod
          cache: true
          cache-dependency-path: apps/codebox/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Test pinned OpenCode host integration
        run: apps/codebox/tests/integration/opencode/run.sh
      - name: Test credential lab server lifecycle
        run: python -m unittest discover -s apps/codebox/tests/integration/credentials/lab -p 'test_*.py' -v

  # The project-secret loader suites and the fixture Go modules are separate
  # modules excluded from go.work, so `go test ./...` inside apps/codebox never
  # reaches them. Dependabot opens PRs against their manifests anyway, and
  # without this job those PRs land green while the recorded pins and loader
  # contracts drift. See https://github.com/etalab-ia/codebox/issues/246.
  fixture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/codebox/tests/integration/project-secrets/package-lock.json
            apps/codebox/tests/integration/project-secrets/native-phase3/guest/node-app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codebox/go.mod
          cache: true
          cache-dependency-path: apps/codebox/go.sum
      - name: Install the qualified Node loaders
        working-directory: apps/codebox/tests/integration/project-secrets
        run: npm ci --ignore-scripts
      - name: Run the Node loader contract suite
        working-directory: apps/codebox/tests/integration/project-secrets
        run: npm test
      - name: Install the qualified Python loaders
        working-directory: apps/codebox/tests/integration/project-secrets
        run: |
          set -eu
          # A venv under RUNNER_TEMP keeps this independent of the runner
          # image's PEP 668 policy -- setup-python's interpreter may be marked
          # externally-managed, where a bare `pip install` exits 1 -- and stays
          # out of the checkout.
          venv="$RUNNER_TEMP/loaders-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-cache-dir -r requirements.txt
          echo "LOADERS_VENV=$venv" >> "$GITHUB_ENV"
      - name: Run the Python loader contract suite
        working-directory: apps/codebox/tests/integration/project-secrets
        run: |
          "$LOADERS_VENV/bin/python" -m unittest -v test_python_loaders.py
      - name: Install the guest Node fixture
        working-directory: apps/codebox/tests/integration/project-secrets/native-phase3/guest/node-app
        run: npm ci --ignore-scripts
      # Covers the embedded guest fixture pins (TestGuestFixtureDependencyPins)
      # and the fixture-side loader/credential contracts. These jobs do not
      # boot a microVM; they build and run the host-side guard tests only.
      - name: Test the fixture Go modules
        run: |
          set -eu
          for module in native native-phase3 native-phase4; do
            dir="apps/codebox/tests/integration/project-secrets/$module"
            echo "::group::$module"
            (cd "$dir" && GOWORK=off go test ./...)
            echo "::endgroup::"
          done

  # Linux builds inside Ubuntu 20.04 so the binary remains compatible with the
  # SDK's glibc baseline instead of inheriting the runner host's newer glibc.
  platform-linux:
    needs: platform-scope
    # Keep every required matrix check observable even when classification fails.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: ubuntu:20.04
      # Explicit resolvers: the runner's embedded container DNS intermittently
      # fails to resolve archive.ubuntu.com (observed 2026-11-11 across several
      # runners), which kills the apt step before any code runs.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Validate platform CI classification
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.platform-scope.result }}
          RUN_PLATFORMS: ${{ needs.platform-scope.outputs.run_platforms }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == "success" ]]
          [[ "$RUN_PLATFORMS" == "true" || "$RUN_PLATFORMS" == "false" ]]
      - name: Report release-only platform skip
        if: needs.platform-scope.outputs.run_platforms == 'false'
        run: echo 'Skipping codebox Linux tests and build for codebox-server release metadata only.'
      - name: Install build tools
        if: needs.platform-scope.outputs.run_platforms == 'true'
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates gcc git
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the mounted workspace
        if: needs.platform-scope.outputs.run_platforms == 'true'
        # VCS stamping shells out to git, and the container user does not own the
        # mounted checkout. Writing the exception to the system config makes it
        # visible to every later step regardless of HOME.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codebox/go.mod
          cache: true
          cache-dependency-path: apps/codebox/go.sum
      - name: Verify native target
        if: needs.platform-scope.outputs.run_platforms == 'true'
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        run: go -C apps/codebox test ./...
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        run: go -C apps/codebox build ./cmd/codebox

  # The SDK embeds a platform-specific FFI library and uses CGO, so macOS and
  # Windows are built and tested on native runners. These jobs do not boot a
  # microVM: hosted runners lack nested virtualization.
  platform-desktop:
    needs: platform-scope
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Validate platform CI classification
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.platform-scope.result }}
          RUN_PLATFORMS: ${{ needs.platform-scope.outputs.run_platforms }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == "success" ]]
          [[ "$RUN_PLATFORMS" == "true" || "$RUN_PLATFORMS" == "false" ]]
      - name: Report release-only platform skip
        if: needs.platform-scope.outputs.run_platforms == 'false'
        shell: bash
        run: echo 'Skipping codebox desktop tests and build for codebox-server release metadata only.'
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test POSIX installer on macOS
        if: needs.platform-scope.outputs.run_platforms == 'true' && matrix.os == 'darwin'
        run: sh apps/codebox/tests/installers/test-posix.sh
      - name: Test PowerShell installer
        if: needs.platform-scope.outputs.run_platforms == 'true' && matrix.os == 'windows'
        shell: powershell
        run: ./apps/codebox/tests/installers/test-windows.ps1
      # The runner's gcc is an x86_64 MinGW cross compiler, which cannot
      # assemble arm64. CGO needs a GNU-ABI aarch64 compiler, so the pinned
      # LLVM-MinGW toolchain is installed for the Windows arm64 leg.
      - name: Install the Windows arm64 C toolchain
        if: needs.platform-scope.outputs.run_platforms == 'true' && matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260616"
          LLVM_MINGW_SHA256: "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:LLVM_MINGW_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "llvm-mingw-$version-ucrt-aarch64\bin")
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=aarch64-w64-mingw32-clang'
          Add-Content -Path $env:GITHUB_ENV -Value 'CXX=aarch64-w64-mingw32-clang++'
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codebox/go.mod
          cache: true
          cache-dependency-path: apps/codebox/go.sum
      - name: Verify native target
        if: needs.platform-scope.outputs.run_platforms == 'true'
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            go env CC | grep -q aarch64-w64-mingw32-clang
          fi
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        run: go -C apps/codebox test ./...
      - if: needs.platform-scope.outputs.run_platforms == 'true'
        run: go -C apps/codebox build ./cmd/codebox

  # The release jobs in release-please.yml only run when a release is created,
  # so PR CI never exercises the artifact actions. Those actions are how a
  # release passes its binaries from the build matrix to the job that publishes
  # them, so a broken hand-off would first show up as a failed release. This
  # job reproduces that hand-off with the same pins and the same inputs
  # (multiple named uploads, then one download with merge-multiple).
  # download-artifact v8 also fails the run when an artifact digest does not
  # match the digest the server reported, which v4 only warned about; that
  # enforcement is checked here rather than discovered during a release.
  artifact-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Upload and download need the Actions artifact API, which the workflow's
    # `contents: read` does not grant. Scoped to this job only.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage release-shaped assets
        run: |
          set -eu
          mkdir -p dist
          # Three distinct names, matching the per-platform asset matrix.
          printf 'linux-x64\n'  > "dist/codebox-linux-x64"
          printf 'linux-arm64\n' > "dist/codebox-linux-arm64"
          printf 'darwin-arm64\n' > "dist/codebox-darwin-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: dist/codebox-linux-x64
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64
          path: dist/codebox-linux-arm64
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-arm64
          path: dist/codebox-darwin-arm64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for all staged artifacts to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-artifacts.sh linux-x64 linux-arm64 darwin-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
          merge-multiple: true
      - name: Verify every asset survived the hand-off
        run: |
          set -eu
          cd downloaded
          ls -la
          # merge-multiple flattens the per-artifact subdirectories, so the
          # publish job's `sha256sum codebox-*` glob must still match all
          # three files here.
          test "$(find . -maxdepth 1 -type f -name 'codebox-*' | wc -l)" -eq 3
          test "$(cat codebox-linux-x64)"   = "linux-x64"
          test "$(cat codebox-linux-arm64)" = "linux-arm64"
          test "$(cat codebox-darwin-arm64)" = "darwin-arm64"
