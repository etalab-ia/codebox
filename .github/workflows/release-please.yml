name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload assets for"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      codebox_release_created: ${{ steps.release.outputs['apps/codebox--release_created'] || steps.dispatch.outputs.codebox_release_created }}
      codebox_tag_name: ${{ steps.release.outputs['apps/codebox--tag_name'] || steps.dispatch.outputs.codebox_tag_name }}
      secrets_gateway_release_created: ${{ steps.release.outputs['apps/secrets-gateway--release_created'] || steps.dispatch.outputs.secrets_gateway_release_created }}
      secrets_gateway_tag_name: ${{ steps.release.outputs['apps/secrets-gateway--tag_name'] || steps.dispatch.outputs.secrets_gateway_tag_name }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Manual path: build and upload assets for an already-released tag, so
      # the artifact pipeline can be exercised without cutting a release.
      - name: Resolve manual dispatch tag
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout happens in this job, so gh has no repository
          # context; without this it fails to resolve the repo and the
          # script misreports it as "no release exists".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! printf '%s\n' "$TAG" | grep -Eq '^(codebox|secrets-gateway)-v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'; then
            echo "::error::Expected a codebox CLI or secrets-gateway release tag, got $TAG."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release exists for $TAG. release-please creates releases; this path only attaches assets."
            exit 1
          fi
          case "$TAG" in
            codebox-*)
              echo "codebox_release_created=true" >> "$GITHUB_OUTPUT"
              echo "codebox_tag_name=$TAG" >> "$GITHUB_OUTPUT"
              echo "secrets_gateway_release_created=false" >> "$GITHUB_OUTPUT"
              ;;
            secrets-gateway-*)
              echo "secrets_gateway_release_created=true" >> "$GITHUB_OUTPUT"
              echo "secrets_gateway_tag_name=$TAG" >> "$GITHUB_OUTPUT"
              echo "codebox_release_created=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-linux:
    needs: release-please
    if: needs.release-please.outputs.codebox_release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: ubuntu:20.04
      # Explicit resolvers: the runner's embedded container DNS intermittently
      # fails to resolve archive.ubuntu.com (observed 2026-11-11 across several
      # runners), which kills the apt step before any code runs.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Install build tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates gcc git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact release tag, not HEAD of main at job start time.
          ref: ${{ needs.release-please.outputs.codebox_tag_name }}
          fetch-depth: 0
      - name: Trust the mounted workspace
        # VCS stamping shells out to git, and the container user does not own the
        # mounted checkout. Writing the exception to the system config makes it
        # visible to every later step regardless of HOME.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      # A manual workflow_dispatch rebuild checks out an existing tag, which may
      # predate the apps/codebox move. Resolve paths from the checked-out tree.
      - name: Resolve checked-out CLI module layout
        run: |
          if [ -f apps/codebox/go.mod ]; then
            echo "CLI_DIR=apps/codebox" >> "$GITHUB_ENV"
            echo "GO_MOD_FILE=apps/codebox/go.mod" >> "$GITHUB_ENV"
            echo "GO_SUM_FILE=apps/codebox/go.sum" >> "$GITHUB_ENV"
            echo "STATS_SYM=github.com/etalab-ia/codebox/apps/codebox/internal/codebox.StatsEndpointDefault" >> "$GITHUB_ENV"
            echo "GATEWAY_SYM=github.com/etalab-ia/codebox/apps/codebox/internal/codebox.SecretsGatewayURLDefault" >> "$GITHUB_ENV"
            echo "DIST_OUT=../../dist" >> "$GITHUB_ENV"
          else
            echo "CLI_DIR=." >> "$GITHUB_ENV"
            echo "GO_MOD_FILE=go.mod" >> "$GITHUB_ENV"
            echo "GO_SUM_FILE=go.sum" >> "$GITHUB_ENV"
            echo "STATS_SYM=github.com/etalab-ia/codebox/internal/codebox.StatsEndpointDefault" >> "$GITHUB_ENV"
            echo "GATEWAY_SYM=github.com/etalab-ia/codebox/internal/codebox.SecretsGatewayURLDefault" >> "$GITHUB_ENV"
            echo "DIST_OUT=dist" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_MOD_FILE }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUM_FILE }}
      - name: Verify native target
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - run: go -C "$CLI_DIR" test ./...
      - name: Build release binary
        env:
          VERSION: ${{ needs.release-please.outputs.codebox_tag_name }}
          # Where usage statistics are sent. Kept in the CODEBOX_STATS_URL
          # repository variable so changing the receiving document is a
          # settings change, not a code change. Empty (unset variable, forks)
          # means no endpoint, and nothing is ever sent.
          STATS_URL: ${{ vars.CODEBOX_STATS_URL }}
          GATEWAY_URL: ${{ vars.CODEBOX_SECRETS_GATEWAY_URL }}
        run: |
          VERSION="${VERSION#codebox-}"
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=$VERSION"
          if [ -n "$STATS_URL" ]; then
            LDFLAGS="$LDFLAGS -X ${STATS_SYM}=$STATS_URL"
          fi
          if [ -n "$GATEWAY_URL" ]; then
            LDFLAGS="$LDFLAGS -X ${GATEWAY_SYM}=$GATEWAY_URL"
          fi
          go -C "$CLI_DIR" build -trimpath -ldflags="$LDFLAGS" \
            -o "${DIST_OUT}/codebox-${{ matrix.asset }}" ./cmd/codebox
          test -f "dist/codebox-${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-desktop:
    needs: release-please
    if: needs.release-please.outputs.codebox_release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            asset: darwin-arm64
            ext: ""
          - runner: windows-2025
            os: windows
            arch: amd64
            asset: windows-x64
            ext: .exe
          - runner: windows-11-arm
            os: windows
            arch: arm64
            asset: windows-arm64
            ext: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact release tag, not HEAD of main at job start time.
          ref: ${{ needs.release-please.outputs.codebox_tag_name }}
          fetch-depth: 0
      # A manual workflow_dispatch rebuild checks out an existing tag, which may
      # predate the apps/codebox move. Resolve paths from the checked-out tree.
      - name: Resolve checked-out CLI module layout
        shell: bash
        run: |
          if [ -f apps/codebox/go.mod ]; then
            echo "CLI_DIR=apps/codebox" >> "$GITHUB_ENV"
            echo "GO_MOD_FILE=apps/codebox/go.mod" >> "$GITHUB_ENV"
            echo "GO_SUM_FILE=apps/codebox/go.sum" >> "$GITHUB_ENV"
            echo "STATS_SYM=github.com/etalab-ia/codebox/apps/codebox/internal/codebox.StatsEndpointDefault" >> "$GITHUB_ENV"
            echo "GATEWAY_SYM=github.com/etalab-ia/codebox/apps/codebox/internal/codebox.SecretsGatewayURLDefault" >> "$GITHUB_ENV"
            echo "DIST_OUT=../../dist" >> "$GITHUB_ENV"
          else
            echo "CLI_DIR=." >> "$GITHUB_ENV"
            echo "GO_MOD_FILE=go.mod" >> "$GITHUB_ENV"
            echo "GO_SUM_FILE=go.sum" >> "$GITHUB_ENV"
            echo "STATS_SYM=github.com/etalab-ia/codebox/internal/codebox.StatsEndpointDefault" >> "$GITHUB_ENV"
            echo "GATEWAY_SYM=github.com/etalab-ia/codebox/internal/codebox.SecretsGatewayURLDefault" >> "$GITHUB_ENV"
            echo "DIST_OUT=dist" >> "$GITHUB_ENV"
          fi
      # The runner's gcc is an x86_64 MinGW cross compiler, which cannot
      # assemble arm64. CGO needs a GNU-ABI aarch64 compiler, so the pinned
      # LLVM-MinGW toolchain is installed for the Windows arm64 leg.
      - name: Install the Windows arm64 C toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260616"
          LLVM_MINGW_SHA256: "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:LLVM_MINGW_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "llvm-mingw-$version-ucrt-aarch64\bin")
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=aarch64-w64-mingw32-clang'
          Add-Content -Path $env:GITHUB_ENV -Value 'CXX=aarch64-w64-mingw32-clang++'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_MOD_FILE }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUM_FILE }}
      - name: Verify native target
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            go env CC | grep -q aarch64-w64-mingw32-clang
          fi
      - shell: bash
        run: go -C "$CLI_DIR" test ./...
      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.codebox_tag_name }}
          STATS_URL: ${{ vars.CODEBOX_STATS_URL }}
          GATEWAY_URL: ${{ vars.CODEBOX_SECRETS_GATEWAY_URL }}
        run: |
          VERSION="${VERSION#codebox-}"
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=$VERSION"
          if [ -n "$STATS_URL" ]; then
            LDFLAGS="$LDFLAGS -X ${STATS_SYM}=$STATS_URL"
          fi
          if [ -n "$GATEWAY_URL" ]; then
            LDFLAGS="$LDFLAGS -X ${GATEWAY_SYM}=$GATEWAY_URL"
          fi
          go -C "$CLI_DIR" build -trimpath -ldflags="$LDFLAGS" \
            -o "${DIST_OUT}/codebox-${{ matrix.asset }}${{ matrix.ext }}" ./cmd/codebox
          test -f "dist/codebox-${{ matrix.asset }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build-linux, build-desktop]
    if: needs.release-please.outputs.codebox_release_created == 'true' && needs.build-linux.result == 'success' && needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum codebox-* > SHA256SUMS
      - name: Remove retired assets
        # --clobber only replaces same-named assets, so a manual rebuild of a
        # release published before a platform change would keep the retired
        # binary live without a matching checksum. Retired: darwin-x64 (SDK
        # v0.6.18 ships no darwin/amd64 FFI library).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.codebox_tag_name }}
        run: |
          if gh release view "$TAG" --json assets --jq '.[].name' | grep -qx 'codebox-darwin-x64'; then
            gh release delete-asset "$TAG" codebox-darwin-x64 --yes
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.codebox_tag_name }}
        run: gh release upload "$TAG" dist/codebox-* dist/SHA256SUMS --clobber

  build-secrets-gateway-container:
    needs: release-please
    if: needs.release-please.outputs.secrets_gateway_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.secrets_gateway_tag_name }}
      - uses: docker/setup-buildx-action@v3
      # Scaleway Container Registry login uses the fixed username `nologin`
      # and an API secret key as the password (verified in Scaleway docs).
      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}
          username: nologin
          password: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/secrets-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/secrets-gateway:${{ needs.release-please.outputs.secrets_gateway_tag_name }}
