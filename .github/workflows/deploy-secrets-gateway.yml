name: Deploy secrets-gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable secrets-gateway release tag"
        required: true
        default: "secrets-gateway-v0.2.0"
        type: string

permissions:
  contents: read

concurrency:
  group: secrets-gateway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Scaleway CLI
        env:
          SCW_VERSION: 2.66.0
          SCW_SHA256: 4d7891fe42ea4d4507fc50df678e9acc000d00780074fb38618ea69d0789fb14
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/scw-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64" \
            -o "$install_dir/scw"
          printf '%s  %s\n' "$SCW_SHA256" "$install_dir/scw" | sha256sum -c -
          chmod 0555 "$install_dir/scw"
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Reconcile the gateway
        id: deploy
        env:
          SCW_CLI: scw
          SCW_ACCESS_KEY: ${{ secrets.CODEBOX_SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.CODEBOX_SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ vars.CODEBOX_SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE }}
          PROCONNECT_CLIENT_ID: ${{ secrets.TF_VAR_PROCONNECT_CLIENT_ID }}
          PROCONNECT_CLIENT_SECRET: ${{ secrets.TF_VAR_PROCONNECT_CLIENT_SECRET }}
          CODEBOX_SECRETS_GATEWAY_URL: ${{ vars.CODEBOX_SECRETS_GATEWAY_URL }}
          GATEWAY_ALLOWED_SIRETS: ${{ vars.CODEBOX_SECRETS_ALLOWED_SIRETS }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/deploy-secrets-gateway.sh

      - name: Publish the deployment summary
        env:
          CONTAINER_ID: ${{ steps.deploy.outputs.container_id }}
          CONTAINER_STATUS: ${{ steps.deploy.outputs.container_status }}
          NATIVE_ORIGIN: ${{ steps.deploy.outputs.native_origin }}
          PUBLIC_URL: ${{ steps.deploy.outputs.gateway_public_url }}
        run: |
          set -euo pipefail
          {
            printf '## Secrets-gateway deployment\n\n'
            printf -- '- Container ID: %s\n' "$CONTAINER_ID"
            printf -- '- Status: %s\n' "$CONTAINER_STATUS"
            printf -- '- Native endpoint: %s\n' "$NATIVE_ORIGIN"
            printf -- '- Configured public URL: %s\n\n' "$PUBLIC_URL"
            if [[ "$PUBLIC_URL" == 'https://bootstrap.invalid' ]]; then
              printf 'Bootstrap complete. Set CODEBOX_SECRETS_GATEWAY_URL to %s, register %s/auth/callback in ProConnect, then rerun this workflow from the GitHub UI.\n' \
                "$NATIVE_ORIGIN" "$NATIVE_ORIGIN"
            else
              printf 'Final public URL applied. Health endpoint: %s/healthz.\n' "$NATIVE_ORIGIN"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
