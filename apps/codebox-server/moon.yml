$schema: "https://moonrepo.dev/schemas/v2/project.json"

id: "codebox-server"
language: "go"
layer: "application"
stack: "backend"

project:
  title: "codebox-server"
  description: "Stateless ProConnect-gated gateway resolving development secrets from an isolated Scaleway Secret Manager project."

dependsOn:
  - "secrets"

fileGroups:
  sources:
    - "file:///deploy/codebox-server/Dockerfile"
    - "file:///deploy/codebox-server/main.tf"
    - "file:///deploy/codebox-server/README.md"

tasks:
  build:
    description: "Compile the codebox-server binary."
    command:
      - "go"
      - "build"
      - "./cmd/codebox-server"
    deps:
      - target: "^:build"
        optional: true
    inputs:
      - "@group(sources)"
      - project: "^"
        group: "sources"
      - "file:///go.work?optional"
